trigger:
  - main
 
pool:
  vmImage: 'ubuntu-latest'
 
variables:
  webAppName: 'my-angular-app-dhiraj'
 
stages:
- stage: Build
  jobs:
  - job: BuildAngularApp
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '22.x'
      displayName: 'Install Node.js'
 
    - script: |
        npm install
        npm run build -- --configuration production
      displayName: 'npm install and build'
 
    - task: ArchiveFiles@2
      inputs:
        rootFolderOrFile: '$(System.DefaultWorkingDirectory)/dist/my-angular-app/browser'
        includeRootFolder: false
        archiveType: 'zip'
        archiveFile: '$(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip'
        replaceExistingArchive: true
      displayName: 'Archive build output'
 
    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'drop'
        publishLocation: 'Container'
      displayName: 'Publish artifact'
 
- stage: Deploy
  dependsOn: Build
  jobs:
  - job: DeployWebApp
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - task: DownloadBuildArtifacts@1
      inputs:
        buildType: 'current'
        downloadType: 'single'
        artifactName: 'drop'
        downloadPath: '$(System.ArtifactsDirectory)'
      displayName: 'Download artifact'
 
    - script: |
        curl -X POST \
          -u "$(DeployUsername):$(DeployPassword)" \
          --data-binary @"$(System.ArtifactsDirectory)/drop/$(Build.BuildId).zip" \
          "https://$(webAppName).scm.azurewebsites.net/api/zipdeploy"
      displayName: 'Deploy via Kudu ZipDeploy'
 